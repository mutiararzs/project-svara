    <script>
    // Ambil basis URL dari domain Railway kamu yang sudah online
    const BASE_URL = "https://project-svara-production.up.railway.app";

    async function loadUsers() {
        const response =
            await fetch(`${BASE_URL}/users`);
        const users =
            await response.json();
        const tableBody =
            document.getElementById(
                "user-list-body"
            );
        tableBody.innerHTML = "";
        users.forEach(user => {
            tableBody.innerHTML += `
            <tr class="hover:bg-white/5 transition-colors">
                <td class="px-6 py-4 text-sm">
                    ${user.nama}
                </td>
                <td class="px-6 py-4 text-sm">
                    ${user.email}
                </td>
                <td class="px-6 py-4 text-sm">
                    ${user.nomorTelepon}
                </td>
                <td class="px-6 py-4 text-sm">
                    ${user.tanggalLahir}
                </td>
                <td class="px-6 py-4">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-success-emerald/10 text-success-emerald border border-success-emerald/20">
                        Aktif
                    </span>
                </td>
                <td class="px-6 py-4 text-right">
                    <div class="flex justify-end gap-2">
                        <button
                            onclick="editUser(${user.id})"
                            class="p-2 rounded-lg text-info-blue hover:bg-info-blue/10">
                            Edit
                        </button>
                        <button
                            onclick="deleteUser(${user.id})"
                            class="p-2 rounded-lg text-error-rose hover:bg-error-rose/10">
                            Delete
                        </button>
                    </div>
                </td>
            </tr>
        `;
    });
}

// DELETE USER
    async function deleteUser(id) {
        await fetch(`${BASE_URL}/users/${id}`, {
            method: "DELETE"
        });
        loadUsers();
    }

// EDIT USER
    async function editUser(id) {
        const nama =
            prompt("Nama baru");
        const email =
            prompt("Email baru");
        const nomorTelepon =
            prompt("Nomor telepon baru");
        const tanggalLahir =
            prompt("Tanggal lahir baru");
        await fetch(
            `${BASE_URL}/users/${id}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body: JSON.stringify({
                    nama:
                        nama,
                    email:
                        email,
                    nomorTelepon:
                        nomorTelepon,
                    tanggalLahir:
                        tanggalLahir
                })
            }
        );
        loadUsers();
    }
// AUTO LOAD
loadUsers();
</script>
