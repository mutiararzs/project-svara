# Konfigurasi JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto: 
# - 'update' otomatis membuat/mengubah tabel berdasarkan Entity Java kamu.
# - Ubah ke 'validate' atau 'none' saat aplikasi sudah naik ke production.
spring.jpa.hibernate.ddl-auto=update

# Memunculkan query SQL di console (opsional, bagus untuk debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true